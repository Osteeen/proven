# Render Blueprint for Proven (PayPal sandbox only).
# Create it from the Render dashboard: New > Blueprint > this repo.
# Prices: read them in the dashboard before applying - Proven and Cosign share
# one $50 hackathon credit. The web service stays on the free plan until judging.

projects:
  - name: proven
    environments:
      - name: production
        databases:
          - name: proven-db
            # FREE until about Nov 1, then UPGRADE to 0.1c-256mb ($10.50/month) in the Render
            # dashboard - a free database expires 30 days after creation (about Nov 11) and is
            # deleted 14 days later, before judging (Dec 1-15). Upgrading before expiry keeps the data.
            # Keeps the shared $50 credit (Proven + Cosign) under budget.
            plan: free
            postgresMajorVersion: "17"
            region: oregon
            # No outside connections: only the Proven web service, over Render's private network.
            ipAllowList: []

        services:
          - type: web
            name: proven
            runtime: node
            plan: free
            region: oregon
            # Migrations and the demo seed run on every deploy, before the new build goes live.
            buildCommand: npm ci --include=dev && npm run db:migrate && npm run db:seed-demo && npm run build
            startCommand: npm run start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: proven-db
                  property: connectionString
              - key: AUTH_SECRET
                generateValue: true
              # Copy this generated value into the GitHub repo secret JOB_SECRET (daily jobs).
              - key: JOB_SECRET
                generateValue: true
              # Keys recipient phone fingerprints (never the numbers themselves). Never rotate it:
              # a new key stops matching numbers listed before.
              - key: RECIPIENT_HMAC_KEY
                generateValue: true
              # The service's https URL, e.g. https://proven.onrender.com - set after the first deploy.
              - key: AUTH_URL
                sync: false
              - key: DEMO_LOGIN
                value: "true"
              - key: PAYPAL_ENV
                value: sandbox
              - key: PAYPAL_CLIENT_ID
                sync: false
              - key: PAYPAL_CLIENT_SECRET
                sync: false
              - key: PAYPAL_PARTNER_MERCHANT_ID
                sync: false
              - key: PAYPAL_PARTNER_ATTRIBUTION_ID
                sync: false
              # From the PayPal app's webhook settings, after the webhook is created.
              - key: PAYPAL_WEBHOOK_ID
                sync: false
              # Claude API key for the AI proof checks (set in the dashboard; never in this file).
              - key: ANTHROPIC_API_KEY
                sync: false
              # The demo charity onboarded in sandbox test 7 (sandbox IDs, not secrets).
              - key: DEMO_CHARITY_TRACKING_ID
                sync: false
              - key: DEMO_CHARITY_MERCHANT_ID
                sync: false
              # The demo supplier that connected PayPal in sandbox tests 11/16 (sandbox IDs, not secrets).
              - key: DEMO_SUPPLIER_TRACKING_ID
                sync: false
              - key: DEMO_SUPPLIER_MERCHANT_ID
                sync: false
              - key: DEMO_SUPPLIER_EMAIL
                sync: false
