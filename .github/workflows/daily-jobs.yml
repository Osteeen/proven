# Proven's daily jobs (Render's free tier has no cron jobs).
# Needs the repo secret JOB_SECRET - the same value as JOB_SECRET on the Render service.
name: Daily jobs

on:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC every day
  workflow_dispatch: {}

permissions: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Proven daily jobs
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PROVEN_URL: https://proven-cwi1.onrender.com
        run: |
          # The free web service may be asleep: allow time to wake, and retry.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${JOB_SECRET}" "${PROVEN_URL}/api/jobs/daily"
